[project]
name = "xclif"
version = "0.4.2"
description = "Xliner's CLI Framework"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Bryan Hu", email = "thatxliner@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.0",
    "rich>=14.0.0",
    "tomlkit>=0.13",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
xclif = "xclif.__main__:cli"

[project.urls]
Homepage = "https://github.com/ThatXliner/xclif"
Documentation = "https://xclif.readthedocs.io/en/latest/index.html"
Repository = "https://github.com/ThatXliner/xclif"

[project.optional-dependencies]
mcp = [
    "mcp>=1.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "click>=8.3.1",
    "mcp>=1.27.0",
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
    "typer>=0.24.1",
]
docs = [
    "sphinx>=8.0",
    "furo>=2024.1.29",
    "myst-parser>=3.0",
    "sphinx-autobuild>=2024.0.0",
]
